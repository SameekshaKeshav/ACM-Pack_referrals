name: Frontend

on:
  # Every PR, not only frontend ones: backend changes (URLs, static settings)
  # can break the deployed app too.
  pull_request:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  chat-connect:
    # Pinned, not ubuntu-latest: that label moved to Ubuntu 26.04 on 2026-11-08,
    # and Playwright 1.56.1 cannot install Chromium there. Move this back to
    # ubuntu-latest only together with a Playwright upgrade that supports it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium
      - run: npm test
